<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Masivo EraDigital</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .font-preload {
            font-family: 'League Spartan', sans-serif;
            font-weight: 700;
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <div class="font-preload">Cargando League Spartan...</div>

    <nav class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center sticky top-0 z-10 shadow-sm">
        <div>
            <h1 class="text-2xl font-black text-slate-800 tracking-tight">Editor Masivo <span class="text-blue-600">EraDigital</span></h1>
            <p class="text-sm text-slate-500">Formato 1440x1440 automático, subida múltiple y memoria robusta.</p>
        </div>
        <div class="flex gap-4 items-center">
            <button onclick="procesarYExportar()" id="btn-exportar" class="px-6 py-2 text-sm font-bold text-white bg-blue-600 rounded hover:bg-blue-700 shadow-sm transition flex items-center gap-2">
                <i class="fa-solid fa-download"></i> Exportar Todo (.zip)
            </button>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-8">
        <div id="editor-container" class="space-y-6"></div>

        <div class="mt-8 flex justify-center border-2 border-dashed border-slate-300 rounded-lg p-8 hover:bg-slate-50 hover:border-blue-400 transition cursor-pointer" onclick="agregarLote()">
            <div class="text-center">
                <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                    <i class="fa-solid fa-plus"></i>
                </div>
                <h3 class="font-semibold text-slate-700">Agregar nueva noticia al lote</h3>
            </div>
        </div>
    </div>

    <script>
        let loteCount = 0;
        
        // Memoria Global: Previene bugs de exportación guardando directamente los objetos Image.
        window.lotesData = {};

        // Cargar el LOGOCIRCULO.png automáticamente
        let logoImage = new Image();
        logoImage.src = 'LOGOCIRCULO.png';
        logoImage.onload = () => console.log('LOGOCIRCULO.png cargado correctamente como marca de agua.');
        logoImage.onerror = () => console.warn('No se encontró LOGOCIRCULO.png. Asegúrate de que el archivo esté en la misma carpeta.');

        document.fonts.load('700 10px "League Spartan"').then(() => console.log('Fuente lista.'));

        document.addEventListener('DOMContentLoaded', () => agregarLote());

        /* ==========================================
           LÓGICA DE INTERFAZ (UI)
        ========================================== */
        function agregarLote() {
            loteCount++;
            const loteId = `lote-${Date.now()}`;
            
            // Inicializar memoria para este lote
            window.lotesData[loteId] = { mainImg: null, extras: [] };

            const container = document.getElementById('editor-container');
            
            const html = `
                <div id="${loteId}" class="lote-item bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden" data-id="${loteCount}">
                    <div class="p-5 flex gap-5 items-start relative">
                        <button onclick="eliminarElemento('${loteId}')" class="absolute top-4 right-4 text-slate-400 hover:text-red-500 transition"><i class="fa-solid fa-xmark text-lg"></i></button>
                        <div class="w-8 h-8 rounded bg-slate-800 text-white flex items-center justify-center font-bold text-sm shrink-0 mt-1">${loteCount}</div>
                        
                        <div class="w-1/3 shrink-0">
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Foto Principal (Se ajustará a 1440x1440)</label>
                            <div class="border-2 border-slate-300 rounded bg-slate-800 aspect-square w-full flex flex-col items-center justify-center relative overflow-hidden group">
                                <input type="file" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" onchange="cargarImagenPrincipal(this, '${loteId}')">
                                
                                <div class="preview-placeholder flex flex-col items-center text-slate-400 z-10 pointer-events-none transition group-hover:text-white">
                                    <i class="fa-solid fa-upload text-3xl mb-2"></i>
                                    <span class="text-sm font-medium">Subir Foto</span>
                                </div>

                                <canvas class="preview-canvas absolute inset-0 w-full h-full object-contain z-10 pointer-events-none opacity-0 transition-opacity"></canvas>
                            </div>
                        </div>

                        <div class="flex-grow">
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Titular (Usa "Enter" para saltos de línea)</label>
                            <textarea oninput="actualizarPreview('${loteId}')" class="main-text-input w-full border border-slate-300 rounded p-3 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none h-44 font-['League_Spartan'] font-bold text-xl" placeholder="Escribe el titular aquí..."></textarea>
                        </div>
                    </div>

                    <div class="bg-slate-50 border-t border-slate-100 px-5 py-3 flex justify-between items-center">
                        <span class="text-sm font-medium text-slate-600"><i class="fa-solid fa-layer-group mr-2"></i>Fotos Extra (Se aplicará el Logo y corte 1440x1440)</span>
                        
                        <input type="file" multiple accept="image/*" id="file-multi-${loteId}" class="hidden" onchange="manejarExtrasMultiples(this, '${loteId}')">
                        <button onclick="document.getElementById('file-multi-${loteId}').click()" class="text-sm text-blue-600 font-semibold px-3 py-1 bg-blue-50 rounded hover:bg-blue-100 transition shadow-sm">
                            + Agregar fotos extra (Multiselección)
                        </button>
                    </div>

                    <div id="extras-${loteId}" class="extras-container bg-slate-50 px-5 pb-4 space-y-3 empty:hidden"></div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        }

        function eliminarElemento(id) { 
            document.getElementById(id)?.remove();
            delete window.lotesData[id];
        }

        /* ==========================================
           LÓGICA DE MEMORIA Y PREVISUALIZACIÓN
        ========================================== */
        function fileToImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = URL.createObjectURL(file);
            });
        }

        async function cargarImagenPrincipal(input, loteId) {
            if (input.files && input.files[0]) {
                const img = await fileToImage(input.files[0]);
                window.lotesData[loteId].mainImg = img; // Guardar en memoria robusta
                
                const loteElement = document.getElementById(loteId);
                loteElement.querySelector('.preview-placeholder').style.display = 'none';
                loteElement.querySelector('.preview-canvas').style.opacity = '1';
                
                actualizarPreview(loteId);
            }
        }

        // Nueva función para procesar MULTIPLES imágenes de un solo golpe
        async function manejarExtrasMultiples(input, loteId) {
            if (!input.files || input.files.length === 0) return;
            
            const container = document.getElementById(`extras-${loteId}`);
            const files = Array.from(input.files);

            for (let file of files) {
                const img = await fileToImage(file);
                const extraId = `extra-${Date.now()}-${Math.floor(Math.random()*1000)}`;
                
                // Guardamos la imagen en el arreglo de extras de este lote
                window.lotesData[loteId].extras.push({ id: extraId, img: img });

                // Renderizamos la miniatura visual en la UI
                const html = `
                    <div id="${extraId}" class="extra-item flex gap-4 items-center bg-white border border-slate-200 rounded p-3 pl-12 relative transition-all">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"><i class="fa-solid fa-arrow-turn-up rotate-90"></i></div>
                        
                        <div class="w-16 h-16 shrink-0 rounded bg-slate-100 overflow-hidden shadow-sm border border-slate-200">
                            <img src="${img.src}" class="w-full h-full object-cover">
                        </div>
                        
                        <div class="flex-grow text-sm text-slate-500 overflow-hidden">
                            <p class="font-medium text-slate-700 truncate">${file.name}</p>
                            <p class="text-xs">Se exportará a 1440x1440 + Logo</p>
                        </div>
                        
                        <button onclick="eliminarExtra('${loteId}', '${extraId}')" class="p-2 text-slate-400 hover:text-red-500 bg-slate-50 rounded hover:bg-red-50"><i class="fa-regular fa-trash-can"></i></button>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            }
            
            input.value = ""; // Limpiamos el input para que pueda volver a agregar más si quiere
        }

        function eliminarExtra(loteId, extraId) {
            // Eliminar de memoria
            window.lotesData[loteId].extras = window.lotesData[loteId].extras.filter(e => e.id !== extraId);
            // Eliminar de UI
            document.getElementById(extraId)?.remove();
        }

        function organizarTexto(texto) {
            if (texto.includes('\n')) {
                return texto.split('\n').map(l => l.trim()).filter(l => l !== '').slice(0, 4); 
            }

            const palabras = texto.trim().replace(/\s+/g, ' ').split(' ');
            const palabrasLimitadas = palabras.slice(0, 12); 
            const lineas = [];
            
            if (palabrasLimitadas.length === 0 || palabrasLimitadas[0] === "") return lineas;

            let wordIndex = 0;
            for (let i = 0; i < 4; i++) {
                let faltanLineas = 4 - i;
                let palabrasRestantes = palabrasLimitadas.length - wordIndex;
                if (palabrasRestantes <= 0) break;
                
                let palabrasParaEstaLinea = Math.ceil(palabrasRestantes / faltanLineas);
                if (palabrasParaEstaLinea > 3) palabrasParaEstaLinea = 3; 
                
                lineas.push(palabrasLimitadas.slice(wordIndex, wordIndex + palabrasParaEstaLinea).join(' '));
                wordIndex += palabrasParaEstaLinea;
            }
            return lineas;
        }

        function actualizarPreview(loteId) {
            const img = window.lotesData[loteId].mainImg;
            if (!img) return;

            const lote = document.getElementById(loteId);
            const texto = lote.querySelector('.main-text-input').value;
            const canvas = lote.querySelector('.preview-canvas');
            
            dibujarEdicion(canvas, img, texto, true);
        }

        /* ==========================================
           MOTOR DE RENDERIZADO CENTRAL
        ========================================== */
        // Dibuja la foto centrada y cortada (Center-Crop) para llenar el Canvas sin estirarse
        function dibujarFondoRecortado(ctx, img, targetSize) {
            const scaleCrop = Math.max(targetSize / img.width, targetSize / img.height);
            const x = (targetSize / 2) - (img.width / 2) * scaleCrop;
            const y = (targetSize / 2) - (img.height / 2) * scaleCrop;
            ctx.drawImage(img, x, y, img.width * scaleCrop, img.height * scaleCrop);
        }

        function dibujarEdicion(canvas, img, texto, isPreview = false) {
            const ctx = canvas.getContext('2d');
            
            // LA MAGIA DEL 1440x1440
            // Si es preview usamos un tamaño menor (800) para rendimiento, si es exportación forzamos los 1440 px.
            const TARGET_SIZE = isPreview ? 800 : 1440;
            const scale = TARGET_SIZE / 1440; // Escala base 1 al exportar.

            canvas.width = TARGET_SIZE;
            canvas.height = TARGET_SIZE;
            
            // 1. Dibujar Imagen de Fondo con recorte perfecto al centro
            dibujarFondoRecortado(ctx, img, TARGET_SIZE);

            // 2. Dibujar Marca de Agua (LOGOCIRCULO.png)
            if (logoImage && logoImage.complete && logoImage.naturalHeight !== 0) {
                ctx.save();
                ctx.globalAlpha = 0.10; 
                const logoWidth = 84 * scale;
                const logoHeight = 84 * scale;
                const logoX = (canvas.width - logoWidth) / 2;
                const logoY = -(logoHeight / 2); 
                ctx.drawImage(logoImage, logoX, logoY, logoWidth, logoHeight);
                ctx.restore();
            }

            const lineas = organizarTexto(texto);
            if (lineas.length === 0) return;

            // 3. Variables de Texto y Barras
            const baseFontSize = 65 * scale; 
            const fontSize = 75 * scale;     
            
            ctx.font = `700 ${fontSize}px "League Spartan", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle'; 
            
            const colorAzul = '#4A78B3'; 
            const grosorLinea = 10 * scale; 
            const barWidth = 720 * scale;
            const margenInferior = 24.1 * scale;
            const separacion = 33.1 * scale;
            
            const baseLineHeight = baseFontSize * 1.1; 
            const baseTextHeight = lineas.length * baseLineHeight; 
            
            const bottomBarY = canvas.height - margenInferior - grosorLinea;
            const textBottomEdge = bottomBarY - separacion;
            const textTopEdge = textBottomEdge - baseTextHeight;
            const topBarY = textTopEdge - separacion - grosorLinea;

            const barX = (canvas.width - barWidth) / 2;

            // 4. Dibujar Sombra Exacta
            const anguloRad = -45 * (Math.PI / 180);
            const distancia = 25 * scale;

            ctx.shadowColor = 'rgba(0, 0, 0, 0.75)'; 
            ctx.shadowBlur = 100 * scale; 
            ctx.shadowOffsetX = Math.cos(anguloRad) * distancia; 
            ctx.shadowOffsetY = Math.sin(anguloRad) * distancia; 

            const textCenterY = (textTopEdge + textBottomEdge) / 2;
            const actualLineHeight = fontSize * 1.1;
            const actualTextHeight = lineas.length * actualLineHeight;
            const startY = textCenterY - (actualTextHeight / 2) + (actualLineHeight / 2);

            // 5. Dibujar el texto
            ctx.fillStyle = '#FFFFFF';
            lineas.forEach((linea, index) => {
                ctx.fillText(linea, canvas.width / 2, startY + (index * actualLineHeight));
            });

            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0; 
            ctx.shadowOffsetX = 0; 
            ctx.shadowOffsetY = 0;

            // 6. Dibujar las barras azules
            ctx.fillStyle = colorAzul;
            ctx.fillRect(barX, topBarY, barWidth, grosorLinea); 
            ctx.fillRect(barX, bottomBarY, barWidth, grosorLinea); 
        }

        async function procesarImagenExtra(img) {
            const canvas = document.createElement('canvas'); 
            const ctx = canvas.getContext('2d');
            
            // Forzar a 1440x1440
            const TARGET_SIZE = 1440;
            canvas.width = TARGET_SIZE;
            canvas.height = TARGET_SIZE;

            // Cortar y rellenar fondo
            dibujarFondoRecortado(ctx, img, TARGET_SIZE);

            // Marca de Agua (84x84px, 10% opacidad, recortada a la mitad)
            if (logoImage && logoImage.complete && logoImage.naturalHeight !== 0) {
                ctx.save();
                ctx.globalAlpha = 0.10; 
                const logoWidth = 84;
                const logoHeight = 84;
                const logoX = (TARGET_SIZE - logoWidth) / 2;
                const logoY = -(logoHeight / 2); 

                ctx.drawImage(logoImage, logoX, logoY, logoWidth, logoHeight);
                ctx.restore();
            }
            return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.95));
        }

        /* ==========================================
           LÓGICA DE EXPORTACIÓN (ZIP)
        ========================================== */
        async function procesarYExportar() {
            const btn = document.getElementById('btn-exportar');
            const lotes = document.querySelectorAll('.lote-item');
            
            if (lotes.length === 0) return alert('No hay noticias para exportar.');
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Procesando...';
            btn.disabled = true;

            const zip = new JSZip();

            for (let lote of lotes) {
                const idNum = lote.getAttribute('data-id');
                const loteId = lote.id; 
                
                // Leemos los datos directamente de la memoria robusta
                const data = window.lotesData[loteId];
                if (!data || !data.mainImg) continue; // Si esta noticia no tiene foto principal, la ignoramos

                const mainText = lote.querySelector('.main-text-input').value;
                const folderName = `Noticia_${idNum}`;
                const folder = zip.folder(folderName);

                // Exportar Principal
                const canvasExport = document.createElement('canvas'); 
                dibujarEdicion(canvasExport, data.mainImg, mainText, false); 
                const blobPrincipal = await new Promise(res => canvasExport.toBlob(res, 'image/jpeg', 0.95));
                folder.file(`1_Principal.jpg`, blobPrincipal);

                // Exportar Extras iterando la memoria
                let extraCount = 2;
                for (let extra of data.extras) {
                    const blobExtra = await procesarImagenExtra(extra.img);
                    folder.file(`${extraCount}_Extra.jpg`, blobExtra);
                    extraCount++;
                }
            }

            zip.generateAsync({ type: "blob" }).then(function(content) {
                saveAs(content, "Lote_EraDigital.zip");
                btn.innerHTML = '<i class="fa-solid fa-download"></i> Exportar Todo (.zip)';
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
